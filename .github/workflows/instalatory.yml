# Instalátory lokální aplikace: Windows (EXE/Inno Setup + MSIX) a macOS (DMG, Apple Silicon).
#
# - ručně nebo pull request: sestaví a otestuje balíčky, nic se nezveřejní;
# - tag v*: navíc založí koncept vydání (draft) s EXE a DMG. MSIX je samostatný Store artefact.
name: Instalátory

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/instalatory.yml"
      - "requirements*.txt"
      - "docs/instalatory.md"
      - "docs/msix-microsoft-store.md"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: github.repository == 'Polik9000/Kudy-jsem-mel-bezet'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Závislosti
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-desktop.txt

      - name: Verze
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          echo "VERSION = \"$v\"" > webapp/_version.py

      - name: Ikony
        run: python desktop/icons.py build/icons

      - name: PyInstaller
        run: pyinstaller --noconfirm desktop/kudy.spec

      # --- Windows ---
      - name: Zkouška spuštění (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\KudyJsemMelBezet\KudyJsemMelBezet.exe" -ArgumentList "--smoke-test" `
               -Wait -PassThru -NoNewWindow -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt, smoke-err.txt
          if ($p.ExitCode -ne 0) { throw "zkouška spuštění selhala ($($p.ExitCode))" }

      - name: MSIX (Windows Store)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          python desktop/msix/build_msix.py --source dist/KudyJsemMelBezet --output dist/KudyJsemMelBezet.msix --version "$env:APP_VERSION"
          Get-Item dist/KudyJsemMelBezet.msix

      - name: Instalátor EXE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" desktop\kudy.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup selhal" }
          Get-Item dist\KudyJsemMelBezet-windows-setup.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-exe-installer
          path: dist/KudyJsemMelBezet-windows-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-msix-store-package
          path: dist/KudyJsemMelBezet.msix
          if-no-files-found: error

      # --- macOS ---
      - name: Podpis ad hoc a zkouška spuštění (macOS)
        if: runner.os == 'macOS'
        run: |
          app="dist/Kudy jsem měl běžet.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/KudyJsemMelBezet" --smoke-test

      - name: Disk .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/dmg
          cp -R "dist/Kudy jsem měl běžet.app" build/dmg/
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Kudy jsem měl běžet" -srcfolder build/dmg -ov -format UDZO \
            dist/KudyJsemMelBezet-macos.dmg
          ls -la dist/KudyJsemMelBezet-macos.dmg

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: macos
          path: dist/KudyJsemMelBezet-macos.dmg
          if-no-files-found: error

  release:
    name: Koncept vydání
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Kudy jsem měl běžet ${{ github.ref_name }}
          body: |
            Instalátory aplikace Kudy jsem měl běžet. MSIX pro Microsoft Store je samostatný artefact v Actions.
            - Windows: KudyJsemMelBezet-windows-setup.exe (Inno Setup, nepodepsaný).
            - macOS: KudyJsemMelBezet-macos.dmg (Apple Silicon, ad-hoc podpis).
            Data zůstávají v uživatelské datové složce; odinstalace je nemaže.
          files: |
            out/KudyJsemMelBezet-windows-setup.exe
            out/KudyJsemMelBezet-macos.dmg
          fail_on_unmatched_files: true

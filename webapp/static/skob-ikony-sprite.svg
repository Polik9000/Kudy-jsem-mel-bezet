  <symbol id="i-archiv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4.4" width="18" height="4.6" rx="1.6"/>
